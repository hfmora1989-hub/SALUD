name: Deploy to Firebase Production (Ambiente de Producción)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  build_and_deploy_production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Deploy to Firebase Hosting (Production Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEALTH_ANALYTICS_PROD }}'
          channelId: live
          projectId: health-analytics-prod
